[workspace]
resolver = "3"
members = ["dex2rs", "dex2rs-core", "dex2rs-runtime"]
# Nothing is excluded any more. The generated-project template lives inside
# `dex2rs` as plain files -- its manifest is `Cargo.toml.tpl`, a name cargo does
# not read as a package -- so there is no nested package here to keep out of the
# workspace, and therefore none for `cargo package` to leave out of the tarball.

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; this is the MSRV `cargo publish` advertises.
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Rodroid Mods <rodroidil2cppdumper@gmail.com>"]
repository = "https://github.com/rodroidil2cppdumper-source/dex2rs"
homepage = "https://github.com/rodroidil2cppdumper-source/dex2rs"
# Inherited paths are resolved against *this* file, so every published crate
# ships the project README as its crates.io page (crates.io rewrites the
# relative image links against `repository`).
readme = "README.md"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.release.package."*"] 
opt-level = 3
codegen-units = 1
strip = true
debug = false
overflow-checks = false
